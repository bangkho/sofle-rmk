# RMK firmware configuration for the PondLabs Sofle V2.
# Reference: https://rmk.rs/main/docs/configuration/

[keyboard]
name = "sofle-rmk"
product_name = "PondLabs Sofle"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "PondLabs"
board = "nice!nano_v2"

# Sofle V2: 5 matrix rows x 6 columns per half, 12 columns across both halves.
[layout]
rows = 5
cols = 12
map = """
(0,0,L)  (0,1,L)  (0,2,L)  (0,3,L)  (0,4,L)  (0,5,L)     (0,6,R)  (0,7,R)  (0,8,R)  (0,9,R)  (0,10,R)  (0,11,R)
(1,0,L)  (1,1,L)  (1,2,L)  (1,3,L)  (1,4,L)  (1,5,L)     (1,6,R)  (1,7,R)  (1,8,R)  (1,9,R)  (1,10,R)  (1,11,R)
(2,0,L)  (2,1,L)  (2,2,L)  (2,3,L)  (2,4,L)  (2,5,L)     (2,6,R)  (2,7,R)  (2,8,R)  (2,9,R)  (2,10,R)  (2,11,R)
(3,0,L)  (3,1,L)  (3,2,L)  (3,3,L)  (3,4,L)  (3,5,L)     (4,5,L)  (4,6,R)  (3,6,R)  (3,7,R)  (3,8,R)   (3,9,R)  (3,10,R)  (3,11,R)
(4,0,L)  (4,1,L)  (4,2,L)  (4,3,L)  (4,4,L)     (4,7,R)  (4,8,R)  (4,9,R)  (4,10,R)  (4,11,R)
"""

[keymap]
layers = 4

# Layer 0 - base
[[keymap.layer]]
keys = """
Grave    Kc1      Kc2      Kc3        Kc4       Kc5            Kc6      Kc7      Kc8      Kc9      Kc0        No
Escape   Q        W        E          R         T              Y        U        I        O        P          Backspace
Tab      A        S        D          F         G              H        J        K        L        Semicolon  Quote
LShift   Z        X        C          V         B     AudioMute  No       N        M        Comma    Dot        Slash      RShift
LCtrl    LGui     LAlt     MO(1)      Enter            Space    MO(2)    RGui     RAlt     RCtrl
"""

# Layer 1 - lower
[[keymap.layer]]
keys = """
_        F1       F2       F3         F4        F5             F6       F7       F8       F9       F10        F11
Grave    Kc1      Kc2      Kc3        Kc4       Kc5            Kc6      Kc7      Kc8      Kc9      Kc0        F12
_        SHIFTED(Kc1) SHIFTED(Kc2) SHIFTED(Kc3) SHIFTED(Kc4) SHIFTED(Kc5)  SHIFTED(Kc6) SHIFTED(Kc7) SHIFTED(Kc8) SHIFTED(Kc9) SHIFTED(Kc0) SHIFTED(Backslash)
_        Equal    Minus    SHIFTED(Equal) SHIFTED(LeftBracket) SHIFTED(RightBracket)  _  _  LeftBracket  RightBracket  Semicolon  SHIFTED(Semicolon)  Backslash  _
_        _        _        _          _         _              _        _        _        _
"""

# Layer 2 - raise
[[keymap.layer]]
keys = """
User7    User0    User1    User2      User3     User4          _        _        _        _        _          _
_        Insert   PrintScreen Application _     _              _        PageUp   PageDown _        Kc0        _
_        LAlt     LCtrl    LShift     _         CapsLock       Left     Up       Down     Right    Delete     Backspace
_        Undo     Cut      Copy       Paste     _      _         _        _        _        _        _          _          _
_        _        _        _          _         _              _        _        _        _
"""

# Layer 3 - adjust (lower + raise)
[[keymap.layer]]
keys = """
User7    User0    User1    User2      User3     User4          No       No       No       No       No         No
No       No       No       No         No        No             No       No       No       No       No         No
No       No       No       No         No        No             No       No       No       No       No         No
No       No       No       No         No        No     No       No       No       No       No       No         No         No
No       No       No       No         No               No       No       No       No       No
"""

# Lower + raise held together adds the adjust layer.
[behavior.tri_layer]
lower = 1
upper = 2
adjust = 3

# Tap-hold timing for the home row mods. Flow tap suppresses the hold decision
# while another key was pressed recently, which is what stops rolls from firing
# modifiers; unilateral tap does the same for same-hand presses.
[host]
vial_enabled = true
rynk_enabled = false

[ble]
enabled = true

[split]
connection = "ble"

# Left half is the central: it owns the host link (USB or BLE).
[split.central]
rows = 5
cols = 6
row_offset = 0
col_offset = 0

[split.central.matrix]
row_pins = ["P0_24", "P1_00", "P0_11", "P1_04", "P1_06"]
col_pins = ["P0_02", "P1_15", "P1_13", "P1_11", "P0_10", "P0_09"]

# Left rotary encoder: A = D21, B = D20.
[[split.peripheral]]
rows = 5
cols = 6
row_offset = 0
col_offset = 6

[split.peripheral.matrix]
row_pins = ["P0_24", "P1_00", "P0_11", "P1_04", "P1_06"]
col_pins = ["P0_09", "P0_10", "P1_11", "P1_13", "P1_15", "P0_02"]

# Right rotary encoder: A = D20, B = D21 (mirrored against the left one).
[rmk]
# Five BLE host slots, same as the ZMK config's BT_SEL 0..4.
ble_profiles_num = 5
