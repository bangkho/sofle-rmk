# RMK firmware configuration for the PondLabs Sofle V2.
# Reference: https://rmk.rs/main/docs/configuration/

[keyboard]
name = "sofle-rmk"
product_name = "PondLabs Sofle"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "PondLabs"
board = "nice!nano_v2"

[layout]
rows = 4
cols = 3
map = """
(0,0)  (0,1)  (0,2)
(1,0)  (1,1)  (1,2)
(2,0)  (2,1)  (2,2)
(3,0)  (3,1)  (3,2)
"""

[keymap]
layers = 3

[[keymap.layer]] # layer 0
keys = """
A       B           C
Kc1     Kc2         Kc3
LCtrl   MO(1)       LShift
OSL(1)  LT(2, Kc9)  LM(1, LShift | LGui)
"""

[[keymap.layer]] # layer 1
keys = """
_  TT(1)  TG(2)
_  _      _
_  _      _
_  _      _
"""

[[keymap.layer]] # layer 2
keys = """
_  _  _
_  _  _
_  _  _
_  _  _
"""

[ble]
enabled = true

[split]
connection = "ble"

[split.central]
rows = 2
cols = 2
row_offset = 0
col_offset = 0

[split.central.matrix]
row_pins = ["P1_04", "P1_06"]
col_pins = ["P0_02", "P1_15"]

[[split.peripheral]]
rows = 2
cols = 1
row_offset = 2
col_offset = 2

[split.peripheral.matrix]
row_pins = ["P1_04", "P1_06"]
col_pins = ["P0_02"]

[rmk]
split_peripherals_num = 1
